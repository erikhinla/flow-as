services:
  flow-gateway:
    build:
      context: ./intake-webhook
    container_name: flow-gateway
    restart: unless-stopped
    environment:
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:-change-me}
    volumes:
      - intake_data:/data/intake
    ports:
      - "8080:8080"
    networks:
      - flow-internal

  bizbrain-lite:
    build:
      context: .
      dockerfile: services/bizbrain_lite/Dockerfile
    container_name: flow-orchestrator
    restart: unless-stopped
    environment:
      BIZBRAIN_ENV: ${BIZBRAIN_ENV:-prod}
      BIZBRAIN_API_TOKEN: ${BIZBRAIN_API_TOKEN:-change-me}
      BIZBRAIN_REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://flow_user:${FLOW_DB_PASSWORD:-change-me}@postgres:5432/flow_agent_os
      FLOW_STATE_DIR: /root/.openclaw/state
      SOCIAL_HUB_API_ORIGIN: ${SOCIAL_HUB_API_ORIGIN:-http://localhost:5173}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ${HOME}/.openclaw/state:/root/.openclaw/state
      - ./runtime/reviews:/app/runtime/reviews
      - ./runtime/queues:/app/runtime/queues
    ports:
      - "18001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - flow-internal


  flow-dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: flow-dashboard
    restart: unless-stopped
    environment:
      DASHBOARD_BASIC_AUTH_USER: ${DASHBOARD_BASIC_AUTH_USER:-admin}
      DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_BASIC_AUTH_PASSWORD:-change-me-dashboard-password}
      BIZBRAIN_API_TOKEN: ${BIZBRAIN_API_TOKEN:?BIZBRAIN_API_TOKEN must be set}
    ports:
      - "5173:80"
    depends_on:
      bizbrain-lite:
        condition: service_healthy
    networks:
      - flow-internal

  hermes-agent:
    image: nousresearch/hermes-agent@sha256:ca249f4d78f317a6cd3f785940c72801b8abe8c7c4fa019d0c3cd25e5966ca74
    container_name: hermes-agent
    restart: unless-stopped
    command: ["python3", "/flow/hermes_runner.py"]
    environment:
      FLOW_RUNTIME_PORT: "18789"
      FLOW_RUNTIME_TIMEOUT_SECONDS: ${FLOW_RUNTIME_TIMEOUT_SECONDS:-900}
      HERMES_AGENT_MODEL: ${HERMES_AGENT_MODEL:-openai/gpt-4o-mini}
      HERMES_UPSTREAM_COMMIT: 7bfbfa3e341a8fe0315170bb7e2ad79e2af44da4
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set}
    volumes:
      - hermes_data:/opt/data
      - ./services/agent_runtimes/hermes_runner.py:/flow/hermes_runner.py:ro
      - ./runtime/agent-workspace:/workspace
      - ./canon/TBTX_CANON:/workspace/TBTX_CANON:ro
    expose:
      - "18789"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18789/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks:
      - flow-internal

  openclaw-agent:
    image: ghcr.io/openclaw/openclaw@sha256:25f5bacf51742c3231d7dd1d319fede009a9d5aeab8b6232cd309ac6475fe82c
    container_name: openclaw-agent
    restart: unless-stopped
    command: ["node", "/flow/openclaw_runner.mjs"]
    environment:
      FLOW_RUNTIME_PORT: "18790"
      FLOW_RUNTIME_TIMEOUT_SECONDS: ${FLOW_RUNTIME_TIMEOUT_SECONDS:-900}
      OPENCLAW_AGENT_MODEL: ${OPENCLAW_AGENT_MODEL:-openrouter/openai/gpt-4o-mini}
      OPENCLAW_UPSTREAM_COMMIT: ad3f74f296e5d82009a55d922159713f691e842e
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set}
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
    volumes:
      - openclaw_data:/home/node/.openclaw
      - ./services/agent_runtimes/openclaw_runner.mjs:/flow/openclaw_runner.mjs:ro
      - ./runtime/agent-workspace:/workspace
      - ./canon/TBTX_CANON:/workspace/TBTX_CANON:ro
    expose:
      - "18790"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18790/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks:
      - flow-internal

  agent-zero:
    image: agent0ai/agent-zero@sha256:a7f5ccf351d612c3eaafc708251490277e1d731afe71a2eaf8aa3d871a55ece4
    container_name: agent-zero
    restart: unless-stopped
    environment:
      WEB_UI_HOST: 0.0.0.0
      ALLOWED_ORIGINS: http://agent-zero
      A0_SET_chat_model_provider: openrouter
      A0_SET_chat_model_name: ${AGENT_ZERO_MODEL:-openai/gpt-4o-mini}
      A0_SET_workdir_path: /workspace
      API_KEY_OPENROUTER: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set}
      AGENT_ZERO_UPSTREAM_COMMIT: 87e1e591e1ba2e8b1a19d34e134fcae490c8dded
    volumes:
      - agent_zero_data:/a0/usr
      - ./runtime/agent-workspace:/workspace
      - ./canon/TBTX_CANON:/workspace/TBTX_CANON:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    networks:
      - flow-internal

  flow-hermes-worker:
    build:
      context: .
      dockerfile: services/bizbrain_lite/Dockerfile
    container_name: flow-hermes-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.queue_worker"]
    environment:
      BIZBRAIN_ENV: ${BIZBRAIN_ENV:-prod}
      BIZBRAIN_API_TOKEN: ${BIZBRAIN_API_TOKEN:-change-me}
      BIZBRAIN_REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://flow_user:${FLOW_DB_PASSWORD:-change-me}@postgres:5432/flow_agent_os
      FLOW_STATE_DIR: /root/.openclaw/state
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      FLOW_QUEUE_OWNER: alpha
      FLOW_EXECUTION_ENGINE: hermes
      FLOW_RUNTIME_URL: http://hermes-agent:18789
      FLOW_QUEUE_TIMEOUT_SECONDS: ${FLOW_QUEUE_TIMEOUT_SECONDS:-5}
      FLOW_WORKER_LOG_LEVEL: ${FLOW_WORKER_LOG_LEVEL:-INFO}
      TBTX_CANON_ROOT: /app/canon/TBTX_CANON
    volumes:
      - ${HOME}/.openclaw/state:/root/.openclaw/state
      - ./runtime/reviews:/app/runtime/reviews
      - ./runtime/queues:/app/runtime/queues
      - ./canon/TBTX_CANON:/app/canon/TBTX_CANON:ro
    depends_on:
      bizbrain-lite:
        condition: service_healthy
      hermes-agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flow-internal

  flow-openclaw-worker:
    build:
      context: .
      dockerfile: services/bizbrain_lite/Dockerfile
    container_name: flow-openclaw-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.queue_worker"]
    environment:
      BIZBRAIN_ENV: ${BIZBRAIN_ENV:-prod}
      BIZBRAIN_API_TOKEN: ${BIZBRAIN_API_TOKEN:-change-me}
      BIZBRAIN_REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://flow_user:${FLOW_DB_PASSWORD:-change-me}@postgres:5432/flow_agent_os
      FLOW_STATE_DIR: /root/.openclaw/state
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      FLOW_QUEUE_OWNER: beta
      FLOW_EXECUTION_ENGINE: openclaw
      FLOW_RUNTIME_URL: http://openclaw-agent:18790
      FLOW_QUEUE_TIMEOUT_SECONDS: ${FLOW_QUEUE_TIMEOUT_SECONDS:-5}
      FLOW_WORKER_LOG_LEVEL: ${FLOW_WORKER_LOG_LEVEL:-INFO}
      TBTX_CANON_ROOT: /app/canon/TBTX_CANON
    volumes:
      - ${HOME}/.openclaw/state:/root/.openclaw/state
      - ./runtime/reviews:/app/runtime/reviews
      - ./runtime/queues:/app/runtime/queues
      - ./canon/TBTX_CANON:/app/canon/TBTX_CANON:ro
    depends_on:
      bizbrain-lite:
        condition: service_healthy
      openclaw-agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flow-internal

  flow-agent-zero-worker:
    build:
      context: .
      dockerfile: services/bizbrain_lite/Dockerfile
    container_name: flow-agent-zero-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.queue_worker"]
    environment:
      BIZBRAIN_ENV: ${BIZBRAIN_ENV:-prod}
      BIZBRAIN_API_TOKEN: ${BIZBRAIN_API_TOKEN:-change-me}
      BIZBRAIN_REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://flow_user:${FLOW_DB_PASSWORD:-change-me}@postgres:5432/flow_agent_os
      FLOW_STATE_DIR: /root/.openclaw/state
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      FLOW_QUEUE_OWNER: gamma
      FLOW_EXECUTION_ENGINE: agent_zero
      FLOW_RUNTIME_URL: http://agent-zero
      FLOW_QUEUE_TIMEOUT_SECONDS: ${FLOW_QUEUE_TIMEOUT_SECONDS:-5}
      FLOW_WORKER_LOG_LEVEL: ${FLOW_WORKER_LOG_LEVEL:-INFO}
      TBTX_CANON_ROOT: /app/canon/TBTX_CANON
    volumes:
      - ${HOME}/.openclaw/state:/root/.openclaw/state
      - ./runtime/reviews:/app/runtime/reviews
      - ./runtime/queues:/app/runtime/queues
      - ./canon/TBTX_CANON:/app/canon/TBTX_CANON:ro
    depends_on:
      bizbrain-lite:
        condition: service_healthy
      agent-zero:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flow-internal

  flow-discord-bot:
    build:
      context: .
      dockerfile: services/discord_bot/Dockerfile
    container_name: flow-discord-bot
    restart: unless-stopped
    profiles: ["discord"]
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      BIZBRAIN_URL: http://bizbrain-lite:8000
      BIZBRAIN_API_TOKEN: ${BIZBRAIN_API_TOKEN:-change-me}
    depends_on:
      bizbrain-lite:
        condition: service_healthy
    networks:
      - flow-internal

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flow-internal

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flow_user
      POSTGRES_PASSWORD: ${FLOW_DB_PASSWORD:-change-me}
      POSTGRES_DB: flow_agent_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow_user -d flow_agent_os"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flow-internal

networks:
  flow-internal:
    name: flow-internal
    driver: bridge

volumes:
  intake_data:
  redis_data:
  postgres_data:
  hermes_data:
  openclaw_data:
  agent_zero_data:
